<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sofa2Slugger — Session 1 Test (Local)</title>
  <style>body{font-family:system-ui,Arial,sans-serif;padding:24px}button{margin-right:8px}</style>
</head>
<body>
  <h1>Session 1 Test (Local)</h1>
  <p>Plays: <strong>session-01-v2-final.mp3</strong></p>

  <audio id="player" controls preload="metadata">
    <source src="session-01-v2-final.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Background music: loops during the session and will be faded out after outro -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music/s1_music_bed" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <div style="margin-top:12px">
    <button id="btnPlay">Play</button>
    <button id="btnPause">Pause</button>
    <button id="btnSkip">Skip To End</button>
    <button id="btnFF">FF +60s</button>
    <button id="btnPlayMusic">Play Music</button>
    <span id="status">Ready</span>
  </div>
  <pre id="debugLog" style="margin-top:12px;background:#111;color:#bada55;padding:8px;max-height:160px;overflow:auto;font-size:12px"></pre>

  <script>
    const a = document.getElementById('player');
    const bg = document.getElementById('bgMusic');
    const status = document.getElementById('status');
    document.getElementById('btnPlay').addEventListener('click', ()=>{ a.play(); });
    document.getElementById('btnPause').addEventListener('click', ()=>{ a.pause(); });

    // Configurable background music volume (slightly lower)
    const MUSIC_VOL = 0.12;
    bg.volume = MUSIC_VOL;

    // Ensure seamless looping: restart when nearing the end (more reliable)
    bg.addEventListener('timeupdate', function(){
      try {
        if (!bg.paused && bg.duration && (bg.duration - bg.currentTime) < 0.3) {
          bg.currentTime = 0.01;
          try { bg.play().catch(()=>{}); } catch(e){}
        }
      } catch(e){}
    });

    // Fallback loop: if 'ended' fires (loop attribute failed on iOS/some browsers), restart
    bg.addEventListener('ended', function(){
      try {
        bg.currentTime = 0.01;
        bg.play().catch(function(){});
      } catch(e){}
    });

    // Diagnostic logging for bg music
    ['play','playing','pause','ended','error','loadedmetadata','canplay','stalled','waiting','suspend'].forEach(ev=>{
      bg.addEventListener(ev, function(e){
        const log = document.getElementById('debugLog');
        var msg = new Date().toISOString() + ' | bg ' + ev + ' | ct=' + (Math.round(bg.currentTime*100)/100) + ' | vol=' + bg.volume + ' | paused=' + bg.paused + '\n';
        if (ev === 'error' && bg.error) msg += '  err=' + bg.error.code + '\n';
        log.textContent = msg + log.textContent;
        console.debug(msg, e);
      });
    });

    document.getElementById('btnPlayMusic').addEventListener('click', function(){
      bg.play().then(()=>{ console.log('bg play ok'); }).catch(function(err){
        const log = document.getElementById('debugLog');
        log.textContent = new Date().toISOString() + ' | bg play failed: ' + err + '\n' + log.textContent;
      });
    });

    // Start background music only after the intro finishes (avoid music under intro)
    const INTRO_LENGTH = 18.05; // seconds (approx intro duration)
    const PRESTART = 0.8; // seconds to start music before intro end
    const MUSIC_START_AT = Math.max(0, INTRO_LENGTH - PRESTART);
    var _bgStartTimer = null;

    function scheduleBgStart() {
      // clear any pending timer
      if (_bgStartTimer) { clearTimeout(_bgStartTimer); _bgStartTimer = null; }
      // if already past threshold, start immediately
      if (a.currentTime >= MUSIC_START_AT) {
        if (bg.paused) bg.play().catch(()=>{});
        return;
      }
      // otherwise schedule to start when threshold is reached
      var delay = (MUSIC_START_AT - a.currentTime) * 1000;
      _bgStartTimer = setTimeout(function(){ _bgStartTimer = null; if (bg.paused) bg.play().catch(()=>{}); }, Math.max(0, delay));
    }

    a.addEventListener('play', function(){ scheduleBgStart(); });
    a.addEventListener('pause', function(){ if (_bgStartTimer) { clearTimeout(_bgStartTimer); _bgStartTimer = null; } });
    // When seeking/timeupdate, re-evaluate whether to start music now
    a.addEventListener('timeupdate', function(){
      if (a.currentTime >= MUSIC_START_AT && bg.paused && !_bgStartTimer) {
        bg.play().catch(()=>{});
      }
    });

    // Fade helpers: fade bg volume to `target` over `dur` ms using rAF
    function fadeBgTo(target, dur){
      if (!bg || !isFinite(bg.volume)) return;
      if (bg._fadeAnim) { cancelAnimationFrame(bg._fadeAnim); bg._fadeAnim = null; }
      var start = performance.now();
      var from = bg.volume;
      var delta = target - from;
      if (Math.abs(delta) < 0.001) return;
      function step(ts){
        var t = Math.min(1, (ts - start) / dur);
        bg.volume = Math.max(0, Math.min(1, from + delta * t));
        if (t < 1) bg._fadeAnim = requestAnimationFrame(step);
        else bg._fadeAnim = null;
      }
      bg._fadeAnim = requestAnimationFrame(step);
    }

    ['play','playing','pause','ended','error','loadedmetadata'].forEach(ev=>{
      a.addEventListener(ev, e=>{
        status.textContent = ev + (ev==='loadedmetadata'? ' — duration: '+(Math.round(a.duration*100)/100)+'s' : '');
        console.log('audio event', ev, e);
      });
    });

    // More diagnostic events for seeking behavior
    ['seeking','seeked','timeupdate','progress','stalled','waiting','canplay','canplaythrough'].forEach(ev=>{
      a.addEventListener(ev, function(e){
        const log = document.getElementById('debugLog');
        const msg = new Date().toISOString() + ' | evt ' + ev + ' | ct=' + (Math.round(a.currentTime*100)/100) + ' | paused=' + a.paused + '\n';
        log.textContent = msg + log.textContent;
        console.debug(msg, e);
      });
    });

    // Skip to end helper for testing: jump near the end and let ended event fire
    document.getElementById('btnSkip').addEventListener('click', function(){
      if (!a.duration || isNaN(a.duration)) return;
      var eps = 0.5;
      try {
        a.currentTime = Math.max(0, a.duration - eps);
        if (a.paused) {
          // Play briefly to ensure 'ended' fires naturally
          a.play().then(function(){ setTimeout(function(){ try{ a.pause(); }catch(e){} }, 200); }).catch(function(){});
        }
      } catch (e) { console.error('skip failed', e); }
    });

    // Fast-forward button: jump ahead 60s (or to near-end if shorter)
    document.getElementById('btnFF').addEventListener('click', function(){
      var dur = a.duration;
      if (!isFinite(dur) || isNaN(dur)) return;
      try {
        var wasPlaying = !a.paused && !a.ended;
        var target = Math.min(dur - 0.5, a.currentTime + 60);
        // only seek if target advances far enough
        if (Math.abs(target - a.currentTime) > 0.25) {
          console.debug('FF request', {from: a.currentTime, to: target, wasPlaying});
          if (typeof a.fastSeek === 'function') {
            try {
              a.fastSeek(target);
            } catch (e) {
              console.warn('fastSeek failed, falling back', e);
              // fallback below
            }
          }

          // Fallback: pause, set currentTime, then restore play state
          if (Math.abs(a.currentTime - target) > 0.2) {
            try {
              var prev = !a.paused && !a.ended;
              a.pause();
              a.currentTime = Math.max(0, target);
              if (prev) {
                // attempt to resume playback after short delay to allow buffer
                setTimeout(function(){
                  a.play().catch(function(err){ console.warn('resume after seek failed', err); });
                }, 120);
              }
            } catch (e) { console.error('seek fallback failed', e); }
          }
        } else {
          console.debug('FF ignored (too small)', {from: a.currentTime, to: target});
        }

        // Log state after a short delay so browser has applied the seek
        setTimeout(function(){
          const log = document.getElementById('debugLog');
          const msg = new Date().toISOString() + ' | FF click | currentTime=' + (Math.round(a.currentTime*100)/100) + ' | duration=' + (Math.round((a.duration||0)*100)/100) + ' | paused=' + a.paused + '\n';
          console.log(msg);
          log.textContent = msg + log.textContent;
        }, 200);
      } catch (e) { console.error('ff failed', e); }
    });

    // Fade the background music about 4s after the narrator finishes.
    // On 'ended' we wait 4s then fade over 4s to 0 and pause.
    a.addEventListener('ended', function(){
      // keep music playing for ~4s after outro, then fade out over 1s
      setTimeout(function(){
        fadeBgTo(0.0, 1000);
        setTimeout(function(){ try{ bg.pause(); bg.currentTime = 0; bg.volume = MUSIC_VOL; }catch(e){} }, 1100);
      }, 4000);
    });
  </script>
</body>
</html>
