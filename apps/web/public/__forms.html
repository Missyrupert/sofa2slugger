<!DOCTYPE html>
<html lang="en">
  <body>
    <form name="founding-listener" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="founding-listener" />
      <input type="hidden" name="subject" value="New Sofa2Slugger founding listener" />
      <input type="email" name="email" />
      <select name="interest">
        <option value="no-gym">I hate gyms</option>
        <option value="confidence">I want to feel more capable</option>
        <option value="stress">I need a stress outlet</option>
        <option value="boxing-curious">I am curious about boxing</option>
        <option value="c25k">I liked Couch to 5K</option>
        <option value="other">Something else</option>
      </select>
      <textarea name="note"></textarea>
      <input type="checkbox" name="consent" value="yes" />
      <input name="bot-field" />
    </form>
    <form name="round-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="round-feedback" />
      <input type="hidden" name="subject" value="New Sofa2Slugger round feedback" />
      <input type="email" name="email" />
      <select name="round">
        <option value="1">Round 01</option>
        <option value="2">Round 02</option>
        <option value="3">Round 03</option>
        <option value="4">Round 04</option>
        <option value="5">Round 05</option>
        <option value="6">Round 06</option>
        <option value="7">Round 07</option>
        <option value="8">Round 08</option>
        <option value="9">Round 09</option>
        <option value="10">Round 10</option>
        <option value="11">Round 11</option>
        <option value="12">Round 12</option>
      </select>
      <textarea name="quote"></textarea>
      <input type="checkbox" name="consent_to_quote" value="yes" />
      <input name="bot-field" />
    </form>
  </body>
</html>
